# Optilandes : environnement de production du TP d'optimisation des performances
#
# Services :
#   caddy     reverse proxy, seul point d'entrée (http://localhost:8080 par défaut)
#   app-bleu  application, environnement bleu (actif au démarrage)
#   app-vert  application, environnement vert (démarré à la demande : profil « vert »)
#   db        base PostgreSQL 16
#   k6        générateur de charge (lancé à la demande : profil « outils »)
#
# Les limites de processeur et de mémoire définissent le « serveur » à analyser.
# Elles sont identiques sur tous les postes : ne pas les modifier sans le noter dans le rapport.

name: optilandes

x-application: &application
  restart: unless-stopped
  pull_policy: never
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 10s
  stop_grace_period: 30s
  deploy:
    resources:
      limits:
        cpus: "1"
        memory: 512M

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./caddy:/etc/caddy:ro
    depends_on:
      - app-bleu
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  app-bleu:
    <<: *application
    image: optilandes-app:${VERSION_BLEU:-1.0.0}
    env_file: ./config/bleu.env

  app-vert:
    <<: *application
    image: optilandes-app:${VERSION_VERT:-1.1.0}
    env_file: ./config/vert.env
    profiles: ["vert"]

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: optilandes
      POSTGRES_USER: optilandes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-optilandes}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    volumes:
      - donnees:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Test en TCP : pendant le chargement initial des données,
      # PostgreSQL n'écoute que sur son socket local et n'est donc pas encore déclaré prêt.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U optilandes -d optilandes"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  k6:
    image: grafana/k6:1.6.1
    profiles: ["outils"]
    volumes:
      - ./k6:/scripts:ro
    environment:
      CIBLE: http://caddy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

volumes:
  donnees:
